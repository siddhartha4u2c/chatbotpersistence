services:
  - type: web
    name: memorybased-chatbot
    runtime: python
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      # Set in the Render dashboard (Secret) — never commit real keys.
      - key: GROQ_API_KEY
        sync: false
      # Optional: point at a persistent disk mount if you add one to the service.
      # - key: CHATBOT_DATA_DIR
      #   value: /var/data
